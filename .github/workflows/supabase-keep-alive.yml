name: Supabase Keep-Alive Ping

on:
  # Jadwal otomatis: setiap 5 hari sekali, jam 00:00 UTC
  schedule:
    - cron: '0 0 */5 * *'

  # Bisa juga dijalankan manual dari GitHub tab Actions
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase via Keep-Alive API
        run: |
          echo "🔄 Pinging Supabase to prevent auto-pause..."

          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/keep-alive" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "📡 HTTP Status: $RESPONSE"
          echo "📋 Response:"
          cat /tmp/response.json

          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Supabase keep-alive ping berhasil!"
          else
            echo "❌ Keep-alive ping gagal dengan status $RESPONSE"
            exit 1
          fi
